name: Copium Pipeline

on:
  repository_dispatch:
    types: [gmail_notification]

concurrency:
  group: gmail-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Gate
        id: gate
        working-directory: backend
        env:
          GMAIL_CLIENT_SECRET_JSON: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          ids=$(uv run python -m copium.gate | tr '\n' ' ' | xargs)
          echo "message_ids=$ids" >> "$GITHUB_OUTPUT"
          if [ -z "$ids" ]; then
            echo "no relevant messages"
          else
            echo "relevant: $ids"
          fi

      - name: Run pipeline
        if: steps.gate.outputs.message_ids != ''
        working-directory: backend
        env:
          GMAIL_CLIENT_SECRET_JSON: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MESSAGE_IDS: ${{ steps.gate.outputs.message_ids }}
        run: uv run python -m main